# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify
        run: make verify

      - name: Build
        run: go build -trimpath -o /tmp/mock .

      - name: Browser UI tests
        run: make test-browser
        env:
          MOCK_BIN: /tmp/mock
          BROWSER_ARTIFACTS: ${{ runner.temp }}/browser-artifacts

      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore

      - name: Check dependencies
        run: make vulncheck

      - name: Race tests
        run: go test ./... -race -count=1
