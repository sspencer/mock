# Builds the documentation site from docs/ with MkDocs (see mkdocs.yml) and
# publishes it to GitHub Pages from master. Pull requests only build it, in
# strict mode, so a broken link or anchor fails the check.
#
# Publishing needs Settings > Pages > Source set to "GitHub Actions".

name: Docs

on:
  push:
    branches: ["master"]
    paths: ["docs/**", "docs-site/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    branches: ["master"]
    paths: ["docs/**", "docs-site/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Build
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
