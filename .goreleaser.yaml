version: 2

project_name: mock

builds:
  - id: mock
    main: .
    binary: mock
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  name_template: "{{.Tag}}"
  header: |
    Release {{.Tag}} of `mock`.

    Install with Go 1.26+:

    ```sh
    go install github.com/sspencer/mock@{{.Tag}}
    ```

    Or download a binary from the assets below.

    See [CHANGELOG.md](https://github.com/sspencer/mock/blob/{{.Tag}}/CHANGELOG.md) for notes.
