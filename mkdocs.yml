# The documentation site: docs/ rendered with MkDocs and the Material theme.
# Build it with `make docs` (or `make docs-serve` to preview); the Docs
# workflow checks it on pull requests and publishes it to GitHub Pages from
# master. Keep nav in step with docs/README.md.
site_name: mock
site_description: Turn REST Client .http files into a local HTTP mock server with hot reload and an admin UI.
site_url: https://sspencer.github.io/mock/
repo_url: https://github.com/sspencer/mock
repo_name: sspencer/mock
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: build/site

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: lime
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: README.md
  - Guides:
      - getting-started.md
      - install.md
      - recipes.md
      - examples.md
  - Writing routes:
      - request-files.md
      - placeholders.md
      - matching.md
      - responses.md
  - Running mock:
      - cli.md
      - real-apis.md
      - testing.md
      - admin-ui.md
      - troubleshooting.md
  - Design notes:
      - ideas.md
